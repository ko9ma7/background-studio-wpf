name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore BackgroundStudio.csproj
      - run: dotnet build BackgroundStudio.csproj --configuration Release --no-restore
      - run: dotnet test BackgroundStudio.Tests.csproj --configuration Release

